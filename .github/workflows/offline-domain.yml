name: Offline domain regression

on:
  pull_request:
    branches: [main, design/pre-tdd-v03]

permissions:
  contents: read

jobs:
  domain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12.14"
          - os: windows-latest
            python: "3.12.10"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise the standalone CLI, domain and synthetic SQLite recovery
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PIP_NO_INDEX: "1"
        run: python -B -m unittest discover -s tests -v

  signed-pair:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: greatgc-flow/Engram
          ref: 42e328dda91a1933cbf7b35efd2f7cc019bb6ec7
          path: _paired-engram
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.10"
      - name: Prepare the pinned build backend
        run: python -m pip install --disable-pip-version-check setuptools==84.2.1
      - name: Stage and run the signed fixture pair
        shell: pwsh
        env:
          PIP_NO_INDEX: "1"
          SOURCE_DATE_EPOCH: "1795824000"
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-Command openssl -ErrorAction SilentlyContinue
          if ($null -ne $tool) {
            $openssl = $tool.Source
          } else {
            $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
            $openssl = Join-Path $gitRoot 'usr/bin/openssl.exe'
          }
          if (!(Test-Path -LiteralPath $openssl -PathType Leaf)) { throw "OpenSSL fixture verifier unavailable" }
          $wheelDir = Join-Path $env:RUNNER_TEMP 'contentflow-pair-wheel'
          python -B -m pip wheel --no-index --no-build-isolation --no-deps -w $wheelDir .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = @(Get-ChildItem -LiteralPath $wheelDir -Filter '*.whl')
          if ($wheel.Count -ne 1) { throw "Expected exactly one local ContentFlow wheel" }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel[0].FullName).Hash.ToLowerInvariant()
          python -B tools/probe_signed_engram.py --engram _paired-engram --wheel $wheel[0].FullName --wheel-sha256 $digest --openssl $openssl
          exit $LASTEXITCODE
