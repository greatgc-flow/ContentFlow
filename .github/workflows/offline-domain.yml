name: Offline domain regression

on:
  pull_request:
    branches: [main, design/pre-tdd-v03]

permissions:
  contents: read

jobs:
  domain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12.14"
          - os: windows-latest
            python: "3.12.10"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise the standalone CLI, domain and synthetic SQLite recovery
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PIP_NO_INDEX: "1"
        run: python -B -m unittest discover -s tests -v
